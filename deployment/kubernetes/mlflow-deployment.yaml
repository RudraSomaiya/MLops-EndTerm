apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
      - name: mlflow-server
        # minimal image: only mlflow==3.16.1, ~200MB, matches our db schema
        # cmd uses exec form so * in --allowed-hosts is never shell-expanded
        image: mlflow-server:3.16.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: mlflow-db
          mountPath: /mlflow-data/mlflow.db
        - name: mlflow-artifacts
          mountPath: /mlflow-data/mlartifacts
      volumes:
      - name: mlflow-db
        hostPath:
          path: /run/desktop/mnt/host/d/Uni Stuff/Final Independence Term/ML-OPS/EndTerm/mlflow.db
          type: File
      - name: mlflow-artifacts
        hostPath:
          path: /run/desktop/mnt/host/d/Uni Stuff/Final Independence Term/ML-OPS/EndTerm/mlartifacts
          type: Directory
