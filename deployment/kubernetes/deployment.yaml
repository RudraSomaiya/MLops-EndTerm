apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-approval-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loan-approval-app
  template:
    metadata:
      labels:
        app: loan-approval-app
    spec:
      containers:
      - name: loan-approval-app
        image: loan-approval-mlops:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          initialDelaySeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 30
          initialDelaySeconds: 30
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
