mlflow:
  tracking_uri: "http://localhost:5000"
  model_name: "loan-approval-model"
  experiment_name: "loan-approval-experiment"

data:
  raw_path: "data/raw/loan_approval_dataset.csv"
  processed_dir: "data/processed"

features:
  target: "loan_status"
  drop_columns:
    - "loan_id"
  categorical:
    - "education"
    - "self_employed"
  numerical:
    - "no_of_dependents"
    - "income_annum"
    - "loan_amount"
    - "loan_term"
    - "cibil_score"
    - "residential_assets_value"
    - "commercial_assets_value"
    - "luxury_assets_value"
    - "bank_asset_value"

validation:
  cibil_score_min: 300
  cibil_score_max: 900

serving:
  host: "0.0.0.0"
  port: 8000
