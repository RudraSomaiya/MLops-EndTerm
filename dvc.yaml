stages:
  ingest:
    cmd: uv run python -m src.ingestion.ingest
    deps:
      - data/raw/loan_approval_dataset.csv
      - src/ingestion/ingest.py
    outs:
      - data/processed/ingested.csv

  validate:
    cmd: uv run python -m src.validation.validate
    deps:
      - data/processed/ingested.csv
      - src/validation/validate.py
    outs:
      - data/processed/validation_report.json

  transform:
    cmd: uv run python -m src.transformation.transform
    deps:
      - data/processed/ingested.csv
      - src/transformation/transform.py
    outs:
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv
      - data/processed/X_train_raw.csv

  train:
    cmd: uv run python -m src.training.train
    deps:
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv
      - src/training/train.py
    outs:
      - data/processed/model_comparison.json
